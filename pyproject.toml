[project]
name = "use-native-japanese"
version = "0.0.0"
description = "日本語の語の組合せを用例に照らして位置付きで確認するツール"
requires-python = ">=3.12"
dependencies = [
    "ginza==5.3.0",
    "ja-ginza==5.3.0",
    "spacy==3.8.16",
    "SudachiPy==0.6.11",
    "SudachiDict-core==20260723",
    "pyprobables==0.7.0",
    "compress-fasttext==0.1.5",
    "gensim==4.4.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
native-japanese = "native_japanese.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/native_japanese"]

[dependency-groups]
dev = ["pytest~=9.1.1", "ruff~=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# 検証済みcompactモデル環境の間接依存も同じlockへ固定する。
constraint-dependencies = [
    "cloudpickle==3.1.2",
    "joblib==1.6.0",
    "narwhals==2.27.1",
    "smart_open==8.0.4",
    "threadpoolctl==3.7.0",
    "wrapt==2.5.1",
]
