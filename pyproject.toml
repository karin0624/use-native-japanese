[project]
name = "use-native-japanese"
version = "0.0.0"
description = "AIなどが書いた不適切な日本語を位置と修正案で指摘することを目指す開発中のツール"
requires-python = ">=3.12"
dependencies = [
    "kwja==2.6.0",
    "torch>=2.9.0",
    "rhoknp==1.8.2",
    "pyprobables==0.7.0",
    "compress-fasttext==0.1.5",
    "gensim==4.4.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
native-japanese = "native_japanese.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/native_japanese"]

[dependency-groups]
dev = ["pytest~=9.1.1", "ruff~=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# 検証済みcompactモデル環境の間接依存も同じlockへ固定する。
constraint-dependencies = [
    "cloudpickle==3.1.2",
    "joblib==1.6.0",
    "narwhals==2.27.1",
    "smart_open==8.0.4",
    "threadpoolctl==3.7.0",
    "wrapt==2.5.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
