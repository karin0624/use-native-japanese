[project]
name = "use-native-japanese"
version = "0.0.0"
description = "日本語の誤り検出手法を比較するためのデータ準備"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
data = [
    "numpy==2.3.5",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "pyarrow==26.0.0",
]

[dependency-groups]
dev = ["pytest~=9.1.1", "ruff~=0.17.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
