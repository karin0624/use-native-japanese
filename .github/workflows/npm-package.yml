name: checkoutとnpm配布物の検証

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-and-package:
    name: checkoutの開発検査と配布物の導入検査 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # 公式releaseのaction.ymlを確認したNode 24版。2026-10-25確認。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: checkoutのNode開発依存を準備
        run: npm ci
      - name: checkoutのNodeテスト
        run: npm test
      - name: checkoutのPython開発環境を準備
        run: npm exec --no -- uv sync --locked --managed-python --python 3.12.13
      - name: KWJA解析モデルを準備
        run: npm exec --no -- uv run --no-sync python -E -X utf8 -m native_japanese setup-parser
      - name: checkoutのPythonテスト
        if: runner.os == 'Linux'
        run: npm exec --no -- uv run --no-sync python -E -X utf8 -m pytest -q
      - name: checkoutのPython静的検査
        if: runner.os == 'Linux'
        run: npm exec --no -- uv run --no-sync ruff check src tests tools
      - name: pack前にcheckoutのソースをtextlintで検査
        run: node --test tools/test-source-checkout.mjs
      - name: 配布物をGit外へpack
        shell: bash
        run: npm pack --workspace packages/textlint-rule-preset-native-japanese --pack-destination "$RUNNER_TEMP"
      - name: 配布物を別プロジェクトへnpm installして検査
        shell: bash
        run: node tools/test-npm-package.mjs "$RUNNER_TEMP/textlint-rule-preset-native-japanese-0.1.0.tgz"
